name: dto-verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-dto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dto-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt

      - name: Resolve PNPM version
        id: pnpm-version
        run: echo "version=$(scripts/resolve_pnpm_version.sh)" >> $GITHUB_OUTPUT

      - name: Setup PNPM
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install schema tool dependencies
        run: pnpm -C packages/schemas install --frozen-lockfile

      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py

      - name: Regenerate DTO bundle
        run: pnpm -C packages/schemas run gen-dts

      - name: Check for unexpected changes
        run: git diff --exit-code packages/schemas/openapi.json packages/schemas/index.d.ts
